name: Validar projeto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run lint

      - name: Testar seguranca de pagamentos
        run: npm run test:security

      - name: Testar jogos
        run: npm run test:games

      - name: Gerar site
        run: npm run build:client
