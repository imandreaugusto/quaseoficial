name: Validar projeto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run lint

      - name: Testar seguranca de pagamentos
        run: npm run test:security

      - name: Testar jogos
        run: npm run test:games

      - name: Gerar site
        run: npm run build:client

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos publicados
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
