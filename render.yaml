services:
  - type: web
    name: brazilian-in-action
    runtime: node
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PUBLIC_URL
        value: https://brazilian-in-action-i036.onrender.com
      - key: PUBLIC_APP_URL
        value: https://brazilian-in-action-i036.onrender.com
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: ABATEPAY_TOKEN
        sync: false
      - key: ABACATEPAY_WEBHOOK_SECRET
        sync: false
      - key: ABACATEPAY_WEBHOOK_HMAC_KEY
        sync: false
      - key: SUBSCRIPTION_PRICE_REAIS
        value: "10"
      - key: SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false